  <script>
    const articles=window.researchArticles||[];
    const params=new URLSearchParams(location.search);
    let i=articles.findIndex(a=>a.id===(params.get("id")||articles[0]?.id));
    if(i<0)i=0;
    const item=articles[i]||{title:"博望研究",category:"博望研究",date:"",read:"",summary:"文章内容暂未配置。",image:"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=2200&q=85",body:["文章内容暂未配置。"],author:"博望餐饮法务团队"};
    const escapeHtml=s=>String(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));
    const detailHref=id=>"article-detail.html?id="+encodeURIComponent(id);
    document.title=item.title+"｜博望研究";
    document.documentElement.style.setProperty("--hero",'url("'+item.image+'")');
    meta.textContent=item.category+"｜"+item.date;
    title.textContent=item.title;
    summary.textContent=item.summary;
    articleBody.innerHTML=(item.body||[]).map((p,idx)=>idx===1?"<h2>文章摘要</h2><p>"+escapeHtml(p)+"</p>":"<p>"+escapeHtml(p)+"</p>").join("")+"<div class='mt-10 border-t border-black/10 pt-6'><a class='inline-flex items-center gap-2 rounded-full bg-black px-5 py-3 text-sm font-black text-white no-underline hover:bg-red-700' href='"+escapeHtml(item.url)+"' target='_blank' rel='noreferrer'>查看公众号原文 <i data-lucide='external-link' class='h-4 w-4'></i></a></div>";
    side.innerHTML=[["栏目",item.category],["发布日期",item.date],["作者",item.author],["阅读",item.read],["来源","博望餐饮法务咨询公众号"]].map(x=>"<div class='flex justify-between gap-4 border-b border-black/10 pb-3'><span>"+escapeHtml(x[0])+"</span><strong class='text-right'>"+escapeHtml(x[1])+"</strong></div>").join("");
    const prev=articles[(i-1+articles.length)%articles.length]||item,next=articles[(i+1)%articles.length]||item;
    prevLink.href=detailHref(prev.id);nextLink.href=detailHref(next.id);prevTitle.textContent=prev.title;nextTitle.textContent=next.title;counter.textContent=(i+1)+" / "+(articles.length||1);
    document.querySelector("[data-menu]")?.addEventListener("click",()=>mobileNav.classList.toggle("hidden"));
    const observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("show");observer.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll(".reveal").forEach(el=>observer.observe(el));window.lucide?.createIcons();
  </script>
