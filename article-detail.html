  <script>
    const articles=[
      {id:"0",cat:"博望观察",date:"2026.06",read:"8 分钟",title:"直营转加盟前必须完成的 8 项法律准备",summary:"从业务模式、费用收取、知识产权授权到培训义务，拆解扩张前的文件清单。",image:"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=2200&q=85",body:["直营转加盟不是把直营门店经验复制成一份合同那么简单。品牌需要先确认加盟商能否稳定获得授权、培训、供应链和运营支持。","第一项准备是业务模型的确认。费用结构、授权范围、门店标准和退出规则必须能被业务团队讲清楚，也能被合同文件承接。","第二项准备是证据留痕。招商材料、沟通记录、培训记录和巡店记录，未来都可能成为争议处理中的关键材料。","第三项准备是管理口径统一。总部、区域和招商团队需要使用同一套话术与模板，避免口头承诺突破合同边界。"]},
      {id:"1",cat:"博望责任",date:"2026.05",read:"6 分钟",title:"门店广告用语如何从“事后删改”变成“事前防控”",summary:"建立审批规则、敏感词库和证据留存，让总部和门店端同频。",image:"https://images.unsplash.com/photo-1556742502-ec7c0e9f34b1?auto=format&fit=crop&w=1600&q=82",body:["门店宣传风险经常发生在活动上线之后。等到投诉或监管关注出现，删除素材只能降低扩散，不能消除已经形成的证据。","事前防控的关键是把审查动作前置到素材生产环节。总部可以建立禁用词、需证明词和需审批词三类词库。","对于区域和门店，法务意见不能停留在抽象规则，而要形成可复制的素材审批表和留痕要求。","当宣传内容涉及效果承诺、价格比较、荣誉资质或加盟收益时，应当进入更高等级的审查流程。"]},
      {id:"2",cat:"博望业绩",date:"2026.05",read:"7 分钟",title:"某餐饮品牌加盟纠纷批量化调解项目复盘",summary:"以统一口径、证据分层和分批谈判降低纠纷扩散风险。",image:"https://images.unsplash.com/photo-1600880292203-757bb62b4baf?auto=format&fit=crop&w=2200&q=85",body:["批量加盟纠纷的难点不只是单个案件胜负，而是如何防止争议口径扩散。","项目第一阶段，我们将加盟商诉求按费用、选址、供应链和运营支持进行分类，并对应梳理证据强弱。","第二阶段建立谈判分层方案，对高风险案件优先推进和解，对证据充分案件保留诉讼策略。","最终目标不是简单压低金额，而是维护品牌后续扩张所需的规则稳定性。"]},
      {id:"3",cat:"博望观察",date:"2026.04",read:"9 分钟",title:"连锁品牌的商业秘密保护不只是一份保密协议",summary:"从配方、供应链、选址模型到招商话术，设计信息分级和权限控制。",image:"https://images.unsplash.com/photo-1450101499163-c8848c66ca85?auto=format&fit=crop&w=2200&q=85",body:["很多企业把商业秘密保护理解为签一份保密协议，但在连锁业务里，真正的风险来自信息被日常经营持续复制和流转。","品牌应当先做信息资产盘点，区分配方、供应商价格、选址模型、培训手册和招商转化话术。","随后建立访问权限和下载留痕，让不同岗位只接触其工作所需的信息。","当加盟商、员工或供应商离开合作关系时，交接和销毁流程同样重要。"]},
      {id:"4",cat:"博望责任",date:"2026.03",read:"5 分钟",title:"区域经理的法务培训应该怎么设计",summary:"把咨询高频问题做成情景题，让一线管理者理解边界。",image:"https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=2200&q=85",body:["区域经理是连锁品牌风险传导的关键节点。他们既要解释总部规则，也要处理门店的一线问题。","有效培训不宜堆叠法条，而应从真实场景开始，比如投诉升级、广告承诺、员工离职和加盟商违约。","每个场景都要给出判断边界、沟通模板和升级条件。","当区域经理知道什么时候可以当场处理，什么时候必须升级法务，风险管理才会真正落地。"]},
      {id:"5",cat:"博望业绩",date:"2026.02",read:"6 分钟",title:"教育连锁校区退费争议治理专项完成",summary:"梳理招生承诺、合同条款、服务记录和沟通证据，建立标准处置表。",image:"https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1600&q=82",body:["退费争议通常不只发生在合同条款里，还发生在招生承诺、课程交付和沟通记录之间。","专项治理首先要还原销售端承诺和交付端实际服务，确认争议的真实触发点。","其次建立退费分级表，把可协商、需补课、需法务介入和建议诉讼的情形区分开。","最后通过培训让校区负责人理解证据留存和沟通边界，减少同类争议反复发生。"]}
    ];
    const params=new URLSearchParams(location.search);let i=articles.findIndex(a=>a.id===(params.get("id")||"0"));if(i<0)i=0;const item=articles[i];document.title=item.title+"｜博望研究";document.documentElement.style.setProperty("--hero",`url("${item.image}")`);meta.textContent=`${item.cat}｜${item.date}`;title.textContent=item.title;summary.textContent=item.summary;articleBody.innerHTML=item.body.map((p,idx)=>idx===1?`<h2>核心观点</h2><p>${p}</p>`:`<p>${p}</p>`).join("");side.innerHTML=[["栏目",item.cat],["日期",item.date],["阅读",item.read],["声明","演示数据"]].map(x=>`<div class="flex justify-between gap-4 border-b border-black/10 pb-3"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join("");const prev=articles[(i-1+articles.length)%articles.length],next=articles[(i+1)%articles.length];prevLink.href=`article-detail.html?id=${prev.id}`;nextLink.href=`article-detail.html?id=${next.id}`;prevTitle.textContent=prev.title;nextTitle.textContent=next.title;counter.textContent=`${i+1} / ${articles.length}`;document.querySelector("[data-menu]")?.addEventListener("click",()=>mobileNav.classList.toggle("hidden"));const observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("show");observer.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll(".reveal").forEach(el=>observer.observe(el));window.lucide?.createIcons();
  </script>
