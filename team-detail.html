  <script>
    const people=[
      {id:"lin",name:"林正远",role:"首席合伙人",photo:"https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=900&q=80",intro:"专注连锁经营、加盟合规与重大商事争议，负责复杂项目的整体策略和关键谈判。",tags:["加盟体系","争议策略","商事诉讼"],details:[["代表经验","曾为餐饮、零售和教育品牌提供扩张期法务体系设计。"],["服务方式","在项目前期参与商业模式讨论，将法律边界转化为可执行规则。"],["近期关注","直营转加盟、区域代理冲突、加盟退出机制。"]]},
      {id:"zhou",name:"周若宁",role:"高级律师",photo:"https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=900&q=80",intro:"擅长门店劳动用工、广告宣传合规和合同模板管理，负责常法服务台账和培训课程设计。",tags:["用工合规","广告审查","合同模板"],details:[["代表经验","为多区域连锁品牌建立门店用工风险台账。"],["服务方式","将合规建议拆成门店端可执行的检查动作。"],["近期关注","短视频宣传、门店招聘、消费者投诉。"]]},
      {id:"chen",name:"陈宇航",role:"争议解决律师",photo:"https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&fit=crop&w=900&q=80",intro:"处理加盟争议、供应链纠纷、租赁谈判和执行案件，擅长批量案件的证据分层管理。",tags:["诉讼仲裁","谈判","执行"],details:[["代表经验","参与加盟纠纷批量调解和供应商违约索赔。"],["服务方式","先做证据强弱分级，再确定谈判与诉讼路径。"],["近期关注","租赁解除、区域代理违约、供应链质量争议。"]]},
      {id:"shen",name:"沈明悦",role:"知识产权顾问",photo:"https://images.unsplash.com/photo-1580894732444-8ecded7900cd?auto=format&fit=crop&w=900&q=80",intro:"负责商标布局、版权保护、商业秘密和品牌授权，支持品牌扩张中的资产保护。",tags:["商标版权","商业秘密","品牌授权"],details:[["代表经验","为连锁品牌梳理商标类别和授权使用规则。"],["服务方式","将品牌资产分级，明确授权、使用、回收和留痕要求。"],["近期关注","加盟商侵权、供应链信息保护、培训资料版权。"]]},

      {id:"tang",name:"唐亦安",role:"培训顾问",photo:"https://images.unsplash.com/photo-1542744094-3a31f272c490?auto=format&fit=crop&w=900&q=80",intro:"将法律风险转化为管理语言，设计招商、运营、区域管理等不同岗位课程。",tags:["课程设计","内训","情景演练"],details:[["代表经验","设计招商话术、门店投诉和区域经理风险课程。"],["服务方式","用真实案例和情景题帮助一线团队掌握边界。"],["近期关注","岗位化课程、课后测评、合规手册。"]]}
    ];
    const params=new URLSearchParams(location.search);let i=people.findIndex(p=>p.id===(params.get("id")||"lin"));if(i<0)i=0;const item=people[i];document.title=item.name+"｜博望团队";photo.src=item.photo;role.textContent=item.role;name.textContent=item.name;intro.textContent=item.intro;tags.innerHTML=item.tags.map(t=>`<span class="rounded-full bg-[#f8f6f1] px-4 py-2 text-sm font-bold">${t}</span>`).join("");details.innerHTML=item.details.map(d=>`<section class="border border-black/10 bg-white p-6"><p class="text-xs font-black uppercase tracking-[.24em] text-red-700">${d[0]}</p><p class="mt-4 leading-8 text-neutral-700">${d[1]}</p></section>`).join("");const prev=people[(i-1+people.length)%people.length],next=people[(i+1)%people.length];prevLink.href=`team-detail.html?id=${prev.id}`;nextLink.href=`team-detail.html?id=${next.id}`;prevTitle.textContent=prev.name;nextTitle.textContent=next.name;counter.textContent=`${i+1} / ${people.length}`;document.querySelector("[data-menu]")?.addEventListener("click",()=>mobileNav.classList.toggle("hidden"));const observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("show");observer.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll(".reveal").forEach(el=>observer.observe(el));window.lucide?.createIcons();
