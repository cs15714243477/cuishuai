    $("photo").src=item.photo;
    $("role").textContent=item.role;
    $("name").textContent=item.name;
    $("intro").textContent=item.intro;
    $("tags").innerHTML=item.tags.map(t=>`<span class="rounded-full bg-[#f8f6f1] px-4 py-2 text-sm font-bold">${t}</span>`).join("");
    $("details").innerHTML=item.details.map(d=>`<section class="border border-black/10 bg-white p-6"><p class="text-xs font-black uppercase tracking-[.24em] text-red-700">${d[0]}</p><p class="mt-4 leading-8 text-neutral-700">${d[1]}</p></section>`).join("");
    $("prevLink").href=`team-detail.html?id=${prev.id}`;
    $("nextLink").href=`team-detail.html?id=${next.id}`;
    $("prevTitle").textContent=prev.name;
    $("nextTitle").textContent=next.name;
    $("counter").textContent=`${i+1} / ${people.length}`;

    document.querySelector("[data-menu]")?.addEventListener("click",()=>$("mobileNav").classList.toggle("hidden"));
    const observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("show");observer.unobserve(e.target)}}),{threshold:.12});
    document.querySelectorAll(".reveal").forEach(el=>observer.observe(el));
    window.lucide?.createIcons();
  </script>
</body>
</html>
